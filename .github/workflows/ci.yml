name: CI/CD Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run tests
      run: mvn test

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Build Docker image
      run: docker build -t ms-notifications:${{ github.sha }} .

    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/develop'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push to Docker Hub
      if: github.ref == 'refs/heads/develop'
      run: |
        docker tag ms-notifications:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/ms-notifications:latest
        docker tag ms-notifications:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/ms-notifications:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/ms-notifications:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/ms-notifications:${{ github.sha }}
